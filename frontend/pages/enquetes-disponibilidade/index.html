<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_tab" name="shell-type"/>
  <title>LouvorApp • Enquetes de Disponibilidade</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/api.js"></script>
  <link href="/shared/theme.css" rel="stylesheet"/>
  <link href="/pages/enquetes-disponibilidade/style.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">
  <header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.4)] pt-safe">
    <div class="h-16 px-margin flex items-center justify-between max-w-4xl mx-auto">
      <div class="flex items-center gap-space-sm">
        <img alt="LouvorApp Logo" class="h-8 w-auto object-contain" onerror="this.src='/assets/images/logo-louvorapp.svg'" src="https://lh3.googleusercontent.com/aida/AEtjO1XhuUUeOsaYUHEp6iTz0s6I47oSmoMlZVVQIRKKfEQ6DGiUDPCSouogn9tHfj5Rh7kbrvyrfC7rgsqcHCqtk62heVYaP2rlOtxyJrHPuWtYhYdqA2ORFrATdYNlqsZXJjhBCrFKxLPLuj0Ip-PV-cBYe7RiTdOnkFhgbbD9K_Bj9DuaVDIqidUGguiYpmdX6t-kQunqVJlr_kDSeLCoq4i6mlLKeSvfWmrCeNbtpcM"/>
        <div class="flex flex-col">
          <span class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-surface leading-none">LouvorApp</span>
          <span class="font-label-sm text-label-sm text-primary tracking-wider uppercase font-semibold leading-none mt-1">Enquetes</span>
        </div>
      </div>
      <div class="flex items-center gap-space-xs">
        <button aria-label="Notificações" class="relative flex items-center justify-center w-11 h-11 rounded-full text-on-surface-variant hover:text-on-surface transition-colors active:scale-95">
          <span class="material-symbols-outlined text-[24px]">notifications</span>
          <span class="hidden absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_#4edea3]" data-notif-badge=""></span>
        </button>
        <a class="relative flex items-center justify-center p-1" href="/pages/perfil-configuracoes/index.html">
          <img alt="Profile" class="hidden w-8 h-8 rounded-full object-cover ring-2 ring-surface-variant" data-user-avatar="" src=""/>
          <span class="absolute -bottom-1 -right-0.5 px-1 py-0.2 bg-secondary text-on-secondary font-label-sm text-[9px] font-bold rounded-full shadow-[0_0_6px_rgba(78,222,163,0.5)] uppercase tracking-tighter scale-90" data-user-role-badge="">Membro</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex flex-col relative w-full px-margin pt-16 pb-24 bg-surface min-h-screen">
    <div class="flex flex-col w-full app-shell-container gap-space-md pt-2">
      <!-- Dynamic Audio Wave Graphic Header Banner -->
      <div class="relative overflow-hidden rounded-xl bg-surface-container-low p-space-md flex flex-col gap-space-sm shadow-md">
        <div class="absolute -right-10 -top-10 w-44 h-44 rounded-full bg-primary-container/10 blur-2xl pointer-events-none"></div>
        <div class="absolute right-8 bottom-2 w-28 h-28 rounded-full bg-secondary/10 blur-xl pointer-events-none"></div>
        <div class="flex items-center justify-between z-10">
          <div class="flex flex-col gap-0.5">
            <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Disponibilidade da Equipe</h2>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Confirme seus dias para as próximas escalas do mês</p>
          </div>
          <button class="w-10 h-10 rounded-full bg-surface-container-high hover:bg-surface-bright flex items-center justify-center text-primary shrink-0 shadow-sm transition-transform active:scale-95" data-admin-only="" id="btnNewPollIcon" title="Criar Enquete (Admin)" type="button">
            <span class="material-symbols-outlined text-[22px]">how_to_vote</span>
          </button>
        </div>

        <div class="w-full h-8 flex items-center justify-center opacity-85 z-10 pt-1">
          <svg class="w-full h-full stroke-primary text-secondary fill-none" preserveAspectRatio="none" viewBox="0 0 320 32">
            <path class="stroke-primary" d="M 0,16 Q 40,4 80,16 T 160,16 T 240,16 T 320,16" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
            <circle class="fill-secondary stroke-none shadow-sm" cx="160" cy="16" r="6"></circle>
          </svg>
        </div>

        <!-- Filter Pills (Alinhado com activeFilter = 'todas' por padrão) -->
        <div class="flex items-center justify-between gap-space-xs pt-1 z-10 overflow-x-auto no-scrollbar">
          <div class="flex items-center gap-space-xs">
            <button class="px-3 py-1.5 rounded-full font-label-md text-label-md bg-primary text-on-primary font-semibold flex items-center gap-1.5 shadow-sm transition-all active:scale-95" id="filter-todas" onclick="setActiveFilter('todas')" type="button">
              Todas
            </button>
            <button class="px-3 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-highest text-on-surface-variant hover:text-on-surface flex items-center gap-1.5 transition-all active:scale-95" id="filter-pendentes" onclick="setActiveFilter('pendentes')" type="button">
              <span>Pendentes</span>
              <span class="bg-primary-container text-on-primary-container px-1.5 py-0.2 rounded-full font-label-sm text-label-sm" id="pendingPollsBadgeCount">0</span>
            </button>
            <button class="px-3 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-highest text-on-surface-variant hover:text-on-surface transition-all active:scale-95" id="filter-encerradas" onclick="setActiveFilter('encerradas')" type="button">
              Encerradas
            </button>
          </div>
          <button class="px-3 py-1.5 rounded-full font-label-sm text-label-sm bg-secondary/20 text-secondary hover:bg-secondary/30 flex items-center gap-1 shrink-0" data-admin-only="" id="btnOpenNewPollModal" type="button">
            <span class="material-symbols-outlined text-[15px]">add</span>
            <span>Nova Enquete</span>
          </button>
        </div>
      </div>

      <!-- Container Dinâmico para Enquete em Destaque -->
      <div id="featuredPollWrapper"></div>

      <!-- Lista de Demais Enquetes -->
      <div class="flex flex-col gap-space-sm" id="otherPollsListContainer"></div>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(0,0,0,0.5)]" data-active-classes="text-primary font-semibold"></nav>

  <script src="/components/navigation.js"></script>
  <script src="/pages/enquetes-disponibilidade/script.js"></script>
</body>
</html>
