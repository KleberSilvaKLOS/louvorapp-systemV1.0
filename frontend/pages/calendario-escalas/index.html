<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_tab" name="shell-type"/>
  <title>LouvorApp • Calendário &amp; Escalas</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/api.js"></script>
  <link href="/shared/theme.css" rel="stylesheet"/>
  <link href="/pages/calendario-escalas/style.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">
  <header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.4)] pt-safe">
    <div class="h-16 px-margin flex items-center justify-between max-w-4xl mx-auto">
      <div class="flex items-center gap-space-sm">
        <img alt="LouvorApp Logo" class="h-8 w-auto object-contain" onerror="this.src='/assets/images/logo-louvorapp.svg'" src="https://lh3.googleusercontent.com/aida/AEtjO1XhuUUeOsaYUHEp6iTz0s6I47oSmoMlZVVQIRKKfEQ6DGiUDPCSouogn9tHfj5Rh7kbrvyrfC7rgsqcHCqtk62heVYaP2rlOtxyJrHPuWtYhYdqA2ORFrATdYNlqsZXJjhBCrFKxLPLuj0Ip-PV-cBYe7RiTdOnkFhgbbD9K_Bj9DuaVDIqidUGguiYpmdX6t-kQunqVJlr_kDSeLCoq4i6mlLKeSvfWmrCeNbtpcM"/>
        <div class="flex flex-col">
          <span class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-surface leading-none">LouvorApp</span>
          <span class="font-label-sm text-label-sm text-primary tracking-wider uppercase font-semibold leading-none mt-1">Calendário</span>
        </div>
      </div>
      <div class="flex items-center gap-space-xs">
        <button aria-label="Notificações" class="relative flex items-center justify-center w-11 h-11 rounded-full text-on-surface-variant hover:text-on-surface transition-colors active:scale-95">
          <span class="material-symbols-outlined text-[24px]">notifications</span>
          <span class="hidden absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-secondary shadow-[0_0_8px_#4edea3]" data-notif-badge=""></span>
        </button>
        <a class="relative flex items-center justify-center p-1" href="/pages/perfil-configuracoes/index.html">
          <img alt="Profile" class="hidden w-8 h-8 rounded-full object-cover ring-2 ring-surface-variant" data-user-avatar="" src=""/>
          <span class="absolute -bottom-1 -right-0.5 px-1 py-0.2 bg-secondary text-on-secondary font-label-sm text-[9px] font-bold rounded-full shadow-[0_0_6px_rgba(78,222,163,0.5)] uppercase tracking-tighter scale-90" data-user-role-badge="">Membro</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex flex-col relative w-full px-margin pt-16 pb-24 bg-surface min-h-screen">
    <div class="flex flex-col w-full app-shell-container pb-16 space-y-space-md pt-2">
      <!-- Top Navigation & Identity Area -->
      <div class="flex items-center justify-between bg-surface-container-low/80 backdrop-blur-md p-space-sm rounded-xl">
        <!-- Month Navigation (Sempre inicializado com o mês/ano atual da máquina) -->
        <div class="flex items-center gap-space-xs">
          <button aria-label="Mês Anterior" class="flex items-center justify-center w-8 h-8 rounded-lg bg-surface-container text-on-surface-variant hover:text-on-surface active:scale-90 transition-transform" id="prevMonthBtn" type="button">
            <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          </button>
          <div class="flex items-center gap-1.5 px-space-xs">
            <span class="font-headline-sm text-headline-sm text-on-surface tracking-tight" id="currentMonthLabel">-</span>
            <span class="font-label-md text-label-md text-primary" id="currentYearLabel">-</span>
          </div>
          <button aria-label="Próximo Mês" class="flex items-center justify-center w-8 h-8 rounded-lg bg-surface-container text-on-surface-variant hover:text-on-surface active:scale-90 transition-transform" id="nextMonthBtn" type="button">
            <span class="material-symbols-outlined text-[18px]">chevron_right</span>
          </button>
        </div>

        <!-- Quick Actions -->
        <div class="flex items-center gap-space-sm">
          <button aria-label="Como Usar o App" class="flex items-center justify-center w-9 h-9 rounded-xl bg-surface-container text-primary hover:bg-surface-container-high active:scale-95 transition-all" onclick="window.LouvorNav.openFirstAccessGuide()" title="Passo a Passo / Como Usar" type="button">
            <span class="material-symbols-outlined text-[20px]">help</span>
          </button>
          <button aria-label="Notificações Pendentes" class="relative flex items-center justify-center w-9 h-9 rounded-xl bg-surface-container text-on-surface-variant hover:text-on-surface active:scale-95 transition-all" type="button">
            <span class="material-symbols-outlined text-[20px]">notifications</span>
            <span class="hidden absolute -top-1 -right-1 flex items-center justify-center min-w-[18px] h-[18px] px-1 bg-secondary text-on-secondary font-label-sm text-[10px] font-bold rounded-full shadow-[0_0_10px_rgba(78,222,163,0.5)]" id="notifCountPill">0</span>
          </button>
        </div>
      </div>

      <!-- Legend Pills -->
      <div class="flex items-center justify-between px-space-xs overflow-x-auto py-1 text-on-surface-variant gap-2">
        <button class="flex items-center gap-1.5 shrink-0 bg-surface-container/60 hover:bg-surface-container px-2.5 py-1 rounded-full transition-colors" onclick="filterCalendarByStatus('confirmed')" type="button">
          <span class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_6px_#4edea3]"></span>
          <span class="font-label-sm text-label-sm text-on-surface">Culto confirmado</span>
        </button>
        <button class="flex items-center gap-1.5 shrink-0 bg-surface-container/60 hover:bg-surface-container px-2.5 py-1 rounded-full transition-colors" onclick="filterCalendarByStatus('rehearsal')" type="button">
          <span class="w-2 h-2 rounded-full bg-tertiary shadow-[0_0_6px_#ffb95f]"></span>
          <span class="font-label-sm text-label-sm text-on-surface">Ensaio agendado</span>
        </button>
        <button class="flex items-center gap-1.5 shrink-0 bg-surface-container/60 hover:bg-surface-container px-2.5 py-1 rounded-full transition-colors" onclick="filterCalendarByStatus('cancelled')" type="button">
          <span class="w-2 h-2 rounded-full bg-error shadow-[0_0_6px_#ffb4ab]"></span>
          <span class="font-label-sm text-label-sm text-on-surface">Cancelado</span>
        </button>
      </div>

      <!-- Interactive Monthly Calendar Grid -->
      <div class="flex flex-col bg-surface-container-low p-space-sm rounded-xl space-y-space-xs shadow-md">
        <div class="grid grid-cols-7 text-center">
          <span class="font-label-sm text-label-sm text-on-surface-variant/80 py-1">Dom</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant/80 py-1">Seg</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant/80 py-1">Ter</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant/80 py-1">Qua</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant/80 py-1">Qui</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant/80 py-1">Sex</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant/80 py-1">Sáb</span>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center" id="calendarDaysGrid"></div>
      </div>

      <!-- Selected Date Detailed Event Card -->
      <div class="flex flex-col bg-surface-container rounded-xl p-space-md shadow-lg space-y-space-md relative overflow-hidden" id="selectedEventCard">
        <div class="absolute -top-12 -right-12 w-36 h-36 bg-primary-container/10 rounded-full blur-2xl pointer-events-none"></div>
        <div class="flex items-start justify-between gap-space-xs">
          <div class="flex flex-col min-w-0">
            <div class="flex items-center gap-space-xs">
              <span class="material-symbols-outlined text-primary text-[20px]">church</span>
              <span class="font-label-sm text-label-sm text-primary uppercase tracking-wider font-semibold" id="eventSubtitle">Data Selecionada</span>
            </div>
            <h2 class="font-headline-md text-headline-md text-on-surface font-bold mt-0.5 truncate" id="eventTitle">Nenhum culto ou ensaio agendado</h2>
            <div class="flex items-center gap-1.5 text-on-surface-variant mt-1">
              <span class="material-symbols-outlined text-[15px] text-tertiary">schedule</span>
              <span class="font-body-sm text-body-sm" id="eventSoundcheckLocation">Selecione ou crie um evento nesta data</span>
            </div>
          </div>

          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-highest text-on-surface-variant font-label-sm text-label-sm uppercase font-bold shrink-0" id="eventStatusBadge">
              Livre
            </span>
            <div class="hidden items-center gap-1" data-admin-only="" id="adminScheduleActions">
              <button class="w-7 h-7 rounded-lg bg-surface-container-highest text-on-surface-variant hover:text-primary flex items-center justify-center" id="btnEditSchedule" title="Editar Evento" type="button">
                <span class="material-symbols-outlined text-[15px]">edit</span>
              </button>
              <button class="w-7 h-7 rounded-lg bg-surface-container-highest text-on-surface-variant hover:text-error flex items-center justify-center" id="btnDeleteSchedule" title="Excluir Evento" type="button">
                <span class="material-symbols-outlined text-[15px]">delete</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Roster Overview Section -->
        <div class="flex flex-col space-y-space-xs pt-1">
          <div class="flex items-center justify-between pb-1">
            <div class="flex items-center gap-1.5">
              <span class="material-symbols-outlined text-primary text-[18px]">groups</span>
              <span class="font-label-md text-label-md text-on-surface font-semibold tracking-wide">Escala da Banda &amp; Vocal</span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="font-label-sm text-label-sm text-secondary bg-secondary/10 px-2 py-0.5 rounded-md font-semibold" id="rosterConfirmedCount">0 Escalados</span>
              <button class="font-label-sm text-label-sm text-primary bg-primary/15 hover:bg-primary/25 px-2 py-0.5 rounded-md font-semibold flex items-center gap-0.5" data-admin-only="" id="btnAddRosterMember" type="button">
                <span class="material-symbols-outlined text-[13px]">person_add</span>
                <span>Escalar</span>
              </button>
            </div>
          </div>
          <div class="space-y-1.5" id="rosterRowsContainer"></div>
        </div>

        <!-- Quick Action Buttons on Selected Event -->
        <div class="grid grid-cols-2 gap-space-sm pt-2">
          <button class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg bg-surface-container-highest text-on-surface font-label-md text-label-md hover:bg-surface-bright active:scale-95 transition-all text-center" id="btnOpenRepertoireModal" type="button">
            <span class="material-symbols-outlined text-[18px] text-primary">queue_music</span>
            <span id="btnRepertoireCountLabel">Repertório (0)</span>
          </button>
          <button class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-lg bg-surface-container-highest text-on-surface font-label-md text-label-md hover:bg-surface-bright active:scale-95 transition-all text-center" id="btnNotifyTeam" type="button">
            <span class="material-symbols-outlined text-[18px] text-secondary">send</span>
            <span>Notificar Equipe</span>
          </button>
        </div>
      </div>

      <!-- Setlist Fast Preview Pill Strip -->
      <div class="flex flex-col bg-surface-container-low p-space-sm rounded-xl space-y-space-xs">
        <div class="flex items-center justify-between">
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase font-semibold" id="fastSetlistLabel">Setlist Rápido</span>
          <button class="font-label-sm text-label-sm text-primary font-medium hover:underline" id="btnOpenBpmTons" type="button">BPM / Tons</button>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-1" id="fastSetlistStrip"></div>
      </div>

      <!-- Floating Action Button (FAB) for Admin to create events -->
      <div class="sticky bottom-4 flex justify-center z-30 pt-1 pointer-events-none" data-admin-only="" id="fabCreateScheduleWrapper">
        <button class="pointer-events-auto flex items-center justify-center gap-2 px-5 py-3 rounded-full bg-primary-container text-on-primary-container font-headline-sm text-headline-sm font-semibold shadow-[0_8px_24px_rgba(77,142,255,0.45)] hover:bg-primary hover:text-on-primary active:scale-95 transition-all" id="btnNewScheduleFab" type="button">
          <span class="material-symbols-outlined text-[22px]">add</span>
          <span>Novo Evento / Escala</span>
        </button>
      </div>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(0,0,0,0.5)]" data-active-classes="text-primary font-semibold"></nav>

  <script src="/components/navigation.js"></script>
  <script src="/pages/calendario-escalas/script.js"></script>
</body>
</html>
