<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>LouvorApp • Gestão de Usuários &amp; Níveis de Acesso (ADMIN)</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/shared/api.js"></script>
  <link href="/shared/theme.css" rel="stylesheet"/>
  <link href="/pages/usuarios/style.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
  <header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.4)] pt-safe">
    <div class="h-16 px-margin flex items-center justify-between max-w-4xl mx-auto">
      <div class="flex items-center gap-space-sm">
        <img alt="LouvorApp Logo" class="h-8 w-auto object-contain" onerror="this.src='/assets/images/logo-louvorapp.svg'" src="/assets/images/logo-louvorapp.svg"/>
        <div class="flex flex-col">
          <span class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-surface leading-none">Gestão de Usuários</span>
          <span class="font-label-sm text-label-sm text-secondary tracking-wider uppercase font-semibold leading-none mt-1">Administração • Níveis de Acesso</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a class="px-3 py-1.5 rounded-lg bg-surface-container-high text-on-surface font-label-sm hover:bg-surface-bright" href="/pages/configuracoes/index.html">Permissões</a>
        <button class="px-3 py-1.5 rounded-lg bg-primary-container text-on-primary-container font-label-sm font-bold flex items-center gap-1" id="btnNewUserModal" type="button">
          <span class="material-symbols-outlined text-[16px]">person_add</span>
          <span>Novo Usuário</span>
        </button>
        <button aria-label="Notificações" class="relative flex items-center justify-center w-10 h-10 rounded-full text-on-surface-variant hover:text-on-surface transition-colors">
          <span class="material-symbols-outlined text-[22px]">notifications</span>
          <span class="hidden absolute top-2 right-2 w-2 h-2 rounded-full bg-secondary" data-notif-badge=""></span>
        </button>
        <a class="relative flex items-center justify-center p-1" href="/pages/perfil-configuracoes/index.html">
          <img alt="Profile" class="hidden w-8 h-8 rounded-full object-cover ring-2 ring-surface-variant" data-user-avatar="" src=""/>
          <span class="absolute -bottom-1 -right-0.5 px-1 py-0.2 bg-secondary text-on-secondary font-label-sm text-[9px] font-bold rounded-full uppercase tracking-tighter scale-90" data-user-role-badge="">ADMIN</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex flex-col relative w-full px-margin pt-16 pb-24 bg-surface min-h-screen">
    <div class="flex flex-col w-full app-shell-container app-shell-wide space-y-4 pt-3">
      <!-- Filtros e Pesquisa -->
      <div class="p-4 rounded-2xl bg-surface-container-low flex flex-col sm:flex-row gap-2.5 items-center justify-between shadow-sm">
        <div class="relative flex items-center w-full sm:flex-1">
          <span class="material-symbols-outlined absolute left-3 text-outline text-[20px]">search</span>
          <input class="w-full h-11 pl-10 pr-4 rounded-xl bg-surface-container-lowest text-on-surface font-body-sm outline-none focus:ring-1 focus:ring-primary" id="searchUsersInput" placeholder="Pesquisar por nome, e-mail ou função..." type="text"/>
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <select class="h-11 px-3 rounded-xl bg-surface-container-lowest text-on-surface font-label-md flex-1 sm:flex-initial" id="filterUserRole">
            <option value="">Todos os Perfis</option>
            <option value="ADMIN">ADMIN (Administradores)</option>
            <option value="USER">USER (Usuários Padrão)</option>
          </select>
        </div>
      </div>

      <!-- Lista de Usuários -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="usersListGrid"></div>
    </div>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(0,0,0,0.5)]"></nav>

  <script src="/components/navigation.js"></script>
  <script src="/pages/usuarios/script.js"></script>
</body>
</html>
