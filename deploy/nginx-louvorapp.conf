# ============================================================================
# LOUVORAPP - CONFIGURAÇÃO DE PROXY REVERSO NGINX + SSL (HTTPS)
# Copie para: /etc/nginx/sites-available/louvorapp
# Ative com : sudo ln -s /etc/nginx/sites-available/louvorapp /etc/nginx/sites-enabled/
# SSL/HTTPS : sudo certbot --nginx -d louvor.suaigreja.org
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name louvor.suaigreja.org;

    # Cabeçalhos de Segurança em Produção
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamanho máximo de payload
    client_max_body_size 10M;

    # Compressão Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Entrega direta de arquivos estáticos pelo Nginx com cache (aliviando o Node.js)
    location ~* ^/(assets|shared|components|pages)/ {
        root /var/www/louvorapp/frontend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri @node_backend;
    }

    location @node_backend {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
